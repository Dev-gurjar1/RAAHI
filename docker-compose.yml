version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: raahi-postgres
    environment:
      POSTGRES_USER: raahi_user
      POSTGRES_PASSWORD: raahi_password
      POSTGRES_DB: raahi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raahi_user -d raahi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raahi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
